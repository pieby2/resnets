<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrbitDesk Support Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>
    
    <main class="container">
        <header class="header">
            <h1>OrbitDesk</h1>
            <span class="badge">AI Support</span>
        </header>

        <section class="chat-container">
            <div id="chat-history" class="chat-history">
                <div class="message system-message">
                    <div class="message-content">
                        Hello! I am the OrbitDesk Support Agent. How can I help you today?
                    </div>
                </div>
            </div>
            
            <div class="input-area">
                <form id="chat-form">
                    <input type="text" id="question-input" placeholder="Ask about workspaces, exports, API..." required autocomplete="off">
                    <button type="submit" id="send-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
            </div>
        </section>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
